<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"  content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="website icon" href="./180daraga.png">
    <link rel="stylesheet" href="index.css" />

    <title>New Stage'19</title>
</head>

<body>
    <main class="game">

        <!-- ================= HEADER ================= -->
        <header class="game-header">
            <div class="brand">
                <img src="./newstage19logo.png" alt="">
                <span class="brand-small">New Stage'19</span>
            </div>
        </header>

        <!-- ================= (level select) ================= -->
        <section id="hubScreen" class="hub-screen">

            <div class="progress-section">
                <div class="progress-text">
                    <span>OVERALL PROGRESS</span>
                    <span id="progressText">0 / 10 completed</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div id="hubGrid" class="hub-grid">
                <!-- level cards injected by newstage19.js -->
            </div>

        </section>

        <!-- ================= GAME SCREEN ================= -->
        <section id="gameScreen" class="hidden">

            <button id="backToMenuBtn" class="btn btn-secondary back-to-menu">
                ↩ BACK TO LEVELS
            </button>

            <!-- ================= PUZZLE ================= -->
            <section class="puzzle-grid">

                <!-- AVAILABLE CARDS -->
                <div class="puzzle-panel">
                    <div class="panel-header">
                        <span id="leftPanelTitle">YOUR CARDS</span>
                        <small id="leftPanelDescription">
                            Drag them into the correct order
                        </small>
                    </div>
                    <div id="cardsContainer" class="cards-container"></div>
                </div>

                <!-- BUILD AREA -->
                <div class="puzzle-panel">
                    <div class="panel-header">
                        <span id="rightPanelTitle">BUILD YOUR SOLUTION</span>
                        <small id="rightPanelDescription">
                            Arrange the sequence here
                        </small>
                    </div>
                    <div id="solutionContainer" class="solution-container drop-zone">
                        <div class="empty-state">Drag your cards here</div>
                    </div>
                </div>

            </section>

            <!-- ================= ACTIONS ================= -->
            <section class="actions">
                <button id="resetBtn" class="btn btn-secondary">↻ RESET</button>
                <button id="checkBtn" class="btn btn-primary">RUN CODE ▶</button>
            </section>

            <!-- ================= OUTPUT ================= -->
            <section class="output-section">
                <div class="output-header">
                    <span>TERMINAL OUTPUT</span>
                    <span class="terminal-dot"></span>
                </div>
                <div id="output" class="output">
                    <span class="output-placeholder">> Waiting for your solution...</span>
                </div>
            </section>

            <!-- ================= RESULT ================= -->
            <div id="resultMessage" class="result-message"></div>

            <!-- ================= NEXT LEVEL================= -->
            <button id="nextLevelBtn" class="next-level hidden">NEXT LEVEL →</button>

        </section>

    </main>

    <div id="confettiContainer"></div>

    <script src="index.js"></script>

</body>
</html>
